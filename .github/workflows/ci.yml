name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # IDA's own modules (ida_kernwin, PyQt5 ...) do not exist on CI, so this only checks syntax.
      - name: Byte-compile the plugin
        run: python -m py_compile plugin/ida_zh_cn.py

      - name: Check the dictionary
        run: python tools/check_dict.py

      - name: Installer round-trip (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'plugins'
          .\install.ps1 -Target $t
          foreach ($f in 'ida_zh_cn.py','zh_cn.json') { if (-not (Test-Path (Join-Path $t $f))) { throw "install failed: $f" } }
          .\install.ps1 -Target $t -Uninstall
          if (Test-Path (Join-Path $t 'ida_zh_cn.py')) { throw 'uninstall failed' }

      - name: Installer round-trip (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x install.sh
          t="$RUNNER_TEMP/plugins"
          ./install.sh --target "$t"
          for f in ida_zh_cn.py zh_cn.json; do
            [ -f "$t/$f" ] || { echo "install failed: $f"; exit 1; }
          done
          ./install.sh --target "$t" --uninstall
          if [ -f "$t/ida_zh_cn.py" ]; then echo "uninstall failed"; exit 1; fi
